<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="10" fill="#0f0e1a"/>

  <!-- Rear wheel -->
  <circle cx="17" cy="42" r="11" fill="none" stroke="url(#g)" stroke-width="2.2"/>
  <circle cx="17" cy="42" r="2" fill="url(#g)"/>
  <!-- Rear spokes -->
  <line x1="17" y1="31" x2="17" y2="53" stroke="url(#g)" stroke-width="0.8" opacity="0.4"/>
  <line x1="6"  y1="42" x2="28" y2="42" stroke="url(#g)" stroke-width="0.8" opacity="0.4"/>
  <line x1="9"  y1="34" x2="25" y2="50" stroke="url(#g)" stroke-width="0.8" opacity="0.4"/>
  <line x1="25" y1="34" x2="9"  y2="50" stroke="url(#g)" stroke-width="0.8" opacity="0.4"/>

  <!-- Front wheel -->
  <circle cx="47" cy="42" r="11" fill="none" stroke="url(#g)" stroke-width="2.2"/>
  <circle cx="47" cy="42" r="2" fill="url(#g)"/>
  <!-- Front spokes -->
  <line x1="47" y1="31" x2="47" y2="53" stroke="url(#g)" stroke-width="0.8" opacity="0.4"/>
  <line x1="36" y1="42" x2="58" y2="42" stroke="url(#g)" stroke-width="0.8" opacity="0.4"/>
  <line x1="39" y1="34" x2="55" y2="50" stroke="url(#g)" stroke-width="0.8" opacity="0.4"/>
  <line x1="55" y1="34" x2="39" y2="50" stroke="url(#g)" stroke-width="0.8" opacity="0.4"/>

  <!-- Frame -->
  <!-- Chain stay: bottom bracket → rear axle -->
  <line x1="30" y1="42" x2="17" y2="42" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Seat tube: bottom bracket → seat top -->
  <line x1="30" y1="42" x2="25" y2="24" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Seat stay: seat top → rear axle -->
  <line x1="25" y1="24" x2="17" y2="42" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top tube: seat top → head tube -->
  <line x1="25" y1="24" x2="43" y2="26" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Down tube: bottom bracket → head tube -->
  <line x1="30" y1="42" x2="44" y2="30" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Fork: head tube → front axle -->
  <line x1="44" y1="30" x2="47" y2="42" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Saddle -->
  <line x1="21" y1="23" x2="30" y2="23" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Handlebar -->
  <line x1="43" y1="26" x2="50" y2="24" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="24" x2="50" y2="19" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bottom bracket ring -->
  <circle cx="30" cy="42" r="3" fill="none" stroke="url(#g)" stroke-width="1.5"/>

  <!-- AI circuit nodes at frame joints -->
  <circle cx="25" cy="24" r="2.8" fill="#a78bfa"/>
  <circle cx="43" cy="26" r="2.8" fill="#60a5fa"/>

  <!-- Circuit traces from seat node -->
  <polyline points="25,24 18,14 10,14" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="18" cy="14" r="1.2" fill="#a78bfa" opacity="0.7"/>
  <circle cx="10" cy="14" r="2"   fill="#a78bfa" opacity="0.9"/>

  <!-- Circuit traces from head node -->
  <polyline points="43,26 51,16 59,16" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="51" cy="16" r="1.2" fill="#60a5fa" opacity="0.7"/>
  <circle cx="59" cy="16" r="2"   fill="#60a5fa" opacity="0.9"/>
</svg>

