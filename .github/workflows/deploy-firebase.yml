name: Deploy to Firebase Hosting

on:
  workflow_run:
    workflows: [ "CI" ]
    types:
      - completed

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Create GitHub Deployment
        id: create_deployment
        uses: actions/github-script@v9
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              required_contexts: [],
              environment: 'production',
              transient_environment: false,
              description: 'Deploy to Firebase Hosting',
              auto_merge: false
            });
            core.setOutput('deployment_id', deployment.data.id.toString());

      - name: Mark deployment in_progress
        id: in_progress
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: parseInt('${{ steps.create_deployment.outputs.deployment_id }}'),
              state: 'in_progress'
            });

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase
        id: firebase_deploy
        run: npx firebase deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Mark deployment success
        if: ${{ success() }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: parseInt('${{ steps.create_deployment.outputs.deployment_id }}'),
              state: 'success',
              environment_url: '${{ vars.DEPLOYMENT_URL }}'
            });

      - name: Mark deployment failure
        if: ${{ failure() }}
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: parseInt('${{ steps.create_deployment.outputs.deployment_id }}'),
              state: 'failure'
            });
