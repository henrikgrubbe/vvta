<div class="flex min-h-screen flex-col">
  <header
    class="sticky top-0 z-10 border-b border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-900"
  >
    <div class="mx-auto max-w-lg px-6 py-3">
      <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
        <a
          class="mr-auto text-lg font-bold text-gray-900 focus:outline-2 focus:outline-offset-2 focus:outline-blue-500 dark:text-gray-100"
          [attr.aria-label]="'APP.TITLE' | translate"
          routerLink="/"
        >
          🚴 {{ 'APP.TITLE' | translate }}
        </a>
        <nav class="flex flex-wrap items-center gap-2" aria-label="Main navigation">
          @if (!isOnOverview()) {
            <a
              class="rounded px-2 py-1 text-sm font-medium text-gray-600 hover:text-gray-900 focus:outline-2 focus:outline-offset-2 focus:outline-blue-500 dark:text-gray-400 dark:hover:text-gray-100"
              routerLink="/"
            >
              ← {{ 'NAV.HOME' | translate }}
            </a>
            <span class="text-gray-300 dark:text-gray-600" aria-hidden="true">|</span>
          }
          @if (!isOnRides()) {
            <a
              class="rounded px-2 py-1 text-sm font-medium text-gray-600 hover:text-gray-900 focus:outline-2 focus:outline-offset-2 focus:outline-blue-500 dark:text-gray-400 dark:hover:text-gray-100"
              routerLink="/rides"
            >
              {{ 'NAV.MY_RIDES' | translate }}
            </a>
          }
          @if (!isOnLeaderboard()) {
            <a
              class="rounded px-2 py-1 text-sm font-medium text-gray-600 hover:text-gray-900 focus:outline-2 focus:outline-offset-2 focus:outline-blue-500 dark:text-gray-400 dark:hover:text-gray-100"
              routerLink="/leaderboard"
            >
              {{ 'NAV.LEADERBOARD' | translate }}
            </a>
          }
          <span class="text-gray-300 dark:text-gray-600" aria-hidden="true">|</span>
          <app-language-switcher />
          <button
            class="flex h-8 w-8 items-center justify-center rounded text-gray-500 hover:bg-gray-100 hover:text-gray-700 focus:outline-2 focus:outline-offset-2 focus:outline-blue-500 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-gray-200"
            [attr.aria-label]="
              (themeService.isDark() ? 'THEME.SWITCH_LIGHT' : 'THEME.SWITCH_DARK') | translate
            "
            [attr.aria-pressed]="themeService.isDark()"
            (click)="themeService.toggle()"
            type="button"
          >
            <span class="material-symbols-outlined">{{
              themeService.isDark() ? 'light_mode' : 'dark_mode'
            }}</span>
          </button>
          <span class="text-gray-300 dark:text-gray-600" aria-hidden="true">|</span>
          <button
            class="rounded px-2 py-1 text-sm text-gray-500 hover:text-gray-700 focus:outline-2 focus:outline-offset-2 focus:outline-blue-500 dark:text-gray-400 dark:hover:text-gray-200"
            (click)="signOut()"
            type="button"
          >
            {{ 'NAV.SIGN_OUT' | translate }}
          </button>
        </nav>
      </div>
    </div>
  </header>
  <main class="flex-1">
    <router-outlet />
  </main>
</div>
