<label class="sr-only" for="lang-select">{{ 'NAV.SWITCH_LANG' | translate }}</label>
<select
  class="cursor-pointer appearance-none rounded bg-transparent px-1 py-0.5 text-base leading-none hover:bg-gray-100 focus:outline-2 focus:outline-offset-2 focus:outline-blue-500 dark:hover:bg-gray-700"
  id="lang-select"
  [formField]="langForm.lang"
  (change)="onChange($event)"
>
  @for (lang of langs; track lang) {
    <option [value]="lang">{{ flags[lang] }}</option>
  }
</select>
