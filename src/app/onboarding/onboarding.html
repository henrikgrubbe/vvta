<main class="flex min-h-screen items-center justify-center bg-gray-50 p-6 dark:bg-gray-900">
  <div class="w-full max-w-sm space-y-6 rounded-2xl bg-white p-8 shadow-md dark:bg-gray-800">
    <div class="text-center">
      <span class="text-5xl" aria-hidden="true">👋</span>
      <h1 class="mt-3 text-2xl font-bold text-gray-900 dark:text-gray-100">
        {{ 'ONBOARDING.TITLE' | translate }}
      </h1>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
        {{ 'ONBOARDING.SUBTITLE' | translate }}
      </p>
    </div>

    <form class="space-y-4" (submit)="save(); $event.preventDefault()" novalidate>
      <div>
        <label
          class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300"
          for="first-name"
        >
          {{ 'ONBOARDING.NAME_LABEL' | translate }}
        </label>
        <input
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:outline-2 focus:outline-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100"
          id="first-name"
          [value]="firstName()"
          [attr.aria-invalid]="touched() && !firstName().trim() ? 'true' : null"
          [attr.aria-describedby]="touched() && !firstName().trim() ? 'name-error' : null"
          [attr.placeholder]="'ONBOARDING.NAME_PLACEHOLDER' | translate"
          (input)="firstName.set($any($event.target).value)"
          type="text"
          autocomplete="given-name"
        />
        @if (touched() && !firstName().trim()) {
          <p class="mt-1 text-sm text-red-600 dark:text-red-400" id="name-error" role="alert">
            {{ 'ONBOARDING.NAME_REQUIRED' | translate }}
          </p>
        }
      </div>

      @if (error()) {
        <p
          class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600 dark:bg-red-900/30 dark:text-red-400"
          role="alert"
        >
          {{ error() }}
        </p>
      }

      <button
        class="w-full rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white hover:bg-blue-700 focus:outline-2 focus:outline-offset-2 focus:outline-blue-500 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="saving()"
        type="submit"
      >
        {{ (saving() ? 'ONBOARDING.SAVING' : 'ONBOARDING.GET_STARTED') | translate }}
      </button>
    </form>
  </div>
</main>
